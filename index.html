<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invitation au mariage | Nour & Amine</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="particles"></div>

<section id="intro">

<div class="glow"></div>

<div class="envelope">

<div class="paper">

<h2>N & A</h2>

<p>Vous êtes cordialement invités</p>

</div>

<div class="back"></div>

<div class="front"></div>

<div class="flap"></div>

<div class="seal" id="seal">

<span>N&A</span>

</div>

</div>

<p class="tap">

Touchez le sceau pour ouvrir

</p>

</section>

<section id="invitation">

<div class="card">

<div class="arabesque top"></div>

<h4>Au nom de nos familles</h4>

<h1>

Nour

<span>&</span>

Amine

</h1>

<p class="subtitle">

Ont la joie de vous convier à leur mariage

</p>

<div class="divider">

❦

</div>

<div class="infos">

<div>

<h3>Date</h3>

<p>Samedi 3 octobre 2026</p>

</div>

<div>

<h3>Heure</h3>

<p>15h00</p>

</div>

<div>

<h3>Lieu</h3>

<p>Villa Azzaitoun</p>

</div>

</div>

<a
class="maps"

href="https://maps.app.goo.gl/i5B5spULPwois7FP7"

target="_blank">

Voir l'itinéraire

</a>

<div id="countdown">

<div>

<span id="days"></span>

<p>Jours</p>

</div>

<div>

<span id="hours"></span>

<p>Heures</p>

</div>

<div>

<span id="minutes"></span>

<p>Minutes</p>

</div>

<div>

<span id="seconds"></span>

<p>Secondes</p>

</div>

</div>

<div class="arabesque bottom"></div>

</div>

</section>

<script src="script.js"></script>

</body>

</html>
